<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RM Informática</title>
<link rel="icon" href="assets/icone.svg" type="image/svg+xml">
<style>
:root{
  --azul:#1d4ed8;--azul-esc:#1e3a8a;--azul-claro:#e8efff;--fundo:#f3f5f9;--card:#fff;--borda:#dfe3ea;--texto:#1b2230;--suave:#667085;
  --verde:#15803d;--verde-cl:#e6f6ec;--amarelo:#a16207;--amarelo-cl:#fdf5d8;--vermelho:#b42318;--vermelho-cl:#fdeceb;--cinza-cl:#eef0f4;
  --raio:10px;--sombra:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto);background:var(--fundo)}
a{color:var(--azul);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:20px;margin:0}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:13px;margin:0 0 8px;color:var(--suave);text-transform:uppercase;letter-spacing:.04em}
.app{display:flex;min-height:100vh}
.lado{width:220px;background:var(--azul-esc);color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.marca{padding:18px 16px;font-weight:700;font-size:17px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.12)}
.marca .logo{width:34px;height:34px;border-radius:8px;background:#fff;color:var(--azul-esc);display:grid;place-items:center;font-weight:800;font-size:14px}
.marca small{display:block;font-weight:400;font-size:11px;opacity:.7}
.menu{padding:8px;flex:1;overflow:auto}
.menu a{display:flex;justify-content:space-between;align-items:center;color:#dbe4ff;padding:9px 12px;border-radius:8px;margin:2px 0}
.menu a:hover{background:rgba(255,255,255,.08);text-decoration:none}
.menu a.ativo{background:#fff;color:var(--azul-esc);font-weight:600}
.menu .bolha{background:#ef4444;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.usuario-box{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;opacity:.9}
.usuario-box a{color:#fff;opacity:.8}
.principal{flex:1;min-width:0;padding:20px 24px 60px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--borda);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--cinza-cl)}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.pri:hover{background:#1e40af}
.btn.perigo{color:var(--vermelho);border-color:#f3c2be}
.btn.peq{padding:4px 9px;font-size:12px}
.btn.link{border:0;background:none;color:var(--azul);padding:2px 4px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:var(--raio);box-shadow:var(--sombra);padding:16px;margin-bottom:16px}
.grade{display:grid;gap:16px;margin-bottom:16px}
.grade>.card{margin-bottom:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.num{font-size:28px;font-weight:700}
.num-card{cursor:pointer}
.num-card .rot{color:var(--suave);font-size:13px}
.tabela-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--borda);vertical-align:top}
th{font-size:12px;color:var(--suave);font-weight:600;background:#fafbfc;position:sticky;top:0}
tbody tr.clicavel{cursor:pointer}
tbody tr.clicavel:hover{background:#f7f9ff}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--cinza-cl);color:#344054;white-space:nowrap}
.tag.ok{background:var(--verde-cl);color:var(--verde)}
.tag.aviso{background:var(--amarelo-cl);color:var(--amarelo)}
.tag.atraso{background:var(--vermelho-cl);color:var(--vermelho)}
.tag.azul{background:var(--azul-claro);color:var(--azul)}
.suave{color:var(--suave)}
.peq{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtros input,.filtros select{padding:7px 10px;border:1px solid var(--borda);border-radius:8px;background:#fff}
.filtros input[type=search]{min-width:240px;flex:1}
.vazio{padding:30px;text-align:center;color:var(--suave)}
/* formulário */
.form-sec{margin-bottom:18px}
.form-sec>h3{border-bottom:1px solid var(--borda);padding-bottom:6px}
.campos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px}
.campo{display:flex;flex-direction:column;gap:3px;min-width:0}
.campo.l2{grid-column:span 2}
.campo.l4{grid-column:1/-1}
.campo label{font-size:12px;color:var(--suave);font-weight:600}
.campo input,.campo select,.campo textarea{padding:7px 9px;border:1px solid var(--borda);border-radius:7px;background:#fff;width:100%}
.campo textarea{min-height:64px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus,.filtros input:focus{outline:2px solid #bfd0ff;border-color:var(--azul)}
.lista-rep{border:1px dashed var(--borda);border-radius:8px;padding:8px}
.rep-linha{display:grid;gap:6px;align-items:end;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--cinza-cl)}
.rep-linha input,.rep-linha select{padding:6px 8px;border:1px solid var(--borda);border-radius:6px;width:100%;background:#fff}
.rep-linha label{font-size:11px;color:var(--suave)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 12px}
.checks label{display:flex;gap:7px;align-items:flex-start;padding:3px 0;cursor:pointer}
.checks input{margin-top:3px}
/* visão de detalhes */
.dl{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px}
.dl div{min-width:0}
.dl dt{font-size:11px;color:var(--suave);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.dl dd{margin:1px 0 0;word-break:break-word}
.dl .l4{grid-column:1/-1}
.dl .l2{grid-column:span 2}
.sub-tabela{font-size:13px}
.sub-tabela th{background:none}
/* modal */
.fundo-modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:12px;width:100%;max-width:980px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.estreito{max-width:520px}
.modal-topo{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--borda);position:sticky;top:0;background:#fff;border-radius:12px 12px 0 0;z-index:2}
.modal-corpo{padding:16px 18px}
.modal-rodape{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--borda);position:sticky;bottom:0;background:#fff;border-radius:0 0 12px 12px}
.fechar{border:0;background:none;font-size:22px;cursor:pointer;line-height:1;color:var(--suave)}
.aviso-caixa{background:var(--amarelo-cl);border:1px solid #f0dfa0;color:#713f12;padding:10px 12px;border-radius:8px;margin-bottom:12px}
.info-caixa{background:var(--azul-claro);border:1px solid #c7d6ff;color:#1e3a8a;padding:10px 12px;border-radius:8px;margin-bottom:12px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:99;max-width:90vw}
#toast.ver{opacity:1}
#toast.erro{background:var(--vermelho)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,#1e3a8a,#1d4ed8)}
.login form{background:#fff;padding:28px;border-radius:14px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.login .campo{margin-bottom:12px}
.login .logo{width:52px;height:52px;border-radius:12px;background:var(--azul-esc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;margin:0 auto 10px}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--borda);margin-bottom:14px;flex-wrap:wrap}
.abas button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--suave);font-weight:600}
.abas button.ativo{border-color:var(--azul);color:var(--azul)}
.senha-val{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--cinza-cl);padding:1px 6px;border-radius:5px}
.menu-btn{display:none}
.so-impressao{display:none}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.campos,.dl{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .app{display:block}
  .lado{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:.2s;z-index:40;height:100%}
  .lado.aberto{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .menu-btn{display:inline-flex}
  .principal{padding:14px 16px 60px}
  .g2{grid-template-columns:1fr}
  .campos,.dl{grid-template-columns:1fr 1fr}
  .campo.l2{grid-column:1/-1}
  .filtros input[type=search]{min-width:0;width:100%}
  .esconde-cel{display:none}
  .fundo-modal{padding:0}
  .modal{border-radius:0;min-height:100vh}
}
@media print{
  .lado,.no-print,.topo .acoes,.menu-btn,.filtros{display:none!important}
  .so-impressao{display:block}
  body{background:#fff}
  .principal{padding:0}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  th{position:static}
}
</style>
</head>
<body>
<div id="raiz"></div>
<div id="toast"></div>
<script>
'use strict';
// ====================================================================
//  RM Informática — inventário, manutenções e senhas dos clientes
// ====================================================================
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const p2 = (n) => String(n).padStart(2, '0');
const isoData = (d) => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const hoje = () => isoData(new Date());
const somaDias = (iso, dias) => { const [a, m, d] = iso.split('-').map(Number); return isoData(new Date(a, m - 1, d + Number(dias))); };
const difDias = (a, b) => { const f = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((f(a) - f(b)) / 864e5); };
const dataBR = (iso) => (iso && /^\d{4}-\d{2}-\d{2}/.test(iso) ? iso.slice(0, 10).split('-').reverse().join('/') : '');
const moeda = (v) => (v === '' || v == null || isNaN(v) ? '' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }));
const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function toast(msg, erro) {
  const t = $('#toast'); t.textContent = msg; t.className = 'ver' + (erro ? ' erro' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.className = ''), erro ? 5000 : 2500);
}

// ---------------- comunicação com o servidor ----------------
async function api(metodo, url, corpo) {
  const r = await fetch(url, {
    method: metodo, credentials: 'same-origin',
    headers: { 'X-RM': '1', ...(corpo ? { 'Content-Type': 'application/json' } : {}) },
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  let dados = {};
  try { dados = await r.json(); } catch {}
  if (r.status === 401 && !url.endsWith('/login')) { EU = null; telaLogin(); throw new Error('Faça login novamente'); }
  if (!r.ok) throw new Error(dados.erro || 'Erro ' + r.status);
  return dados;
}

let EU = null;
const DB = { clientes: {}, equipamentos: {}, manutencoes: {}, config: {} };
let VERSAO = 0;
const ehAdmin = () => EU && EU.perfil === 'admin';
const podeSenhas = () => EU && (EU.perfil === 'admin' || EU.pode_senhas);

async function carregar() {
  const r = await api('GET', '/api/estado?desde=' + VERSAO);
  let mudou = false;
  for (const it of r.itens) {
    if (!DB[it.c]) continue;
    mudou = true;
    if (it.apagado) delete DB[it.c][it.id]; else DB[it.c][it.id] = it.dados;
  }
  VERSAO = r.versao;
  return mudou;
}
async function salvar(c, obj) {
  obj.id = obj.id || uid();
  if (!obj.criadoEm) { obj.criadoEm = new Date().toISOString(); obj.criadoPor = EU.nome; }
  obj.atualizadoEm = new Date().toISOString(); obj.atualizadoPor = EU.nome;
  await api('POST', '/api/sync', { ops: [{ c, id: obj.id, dados: obj }] });
  DB[c][obj.id] = obj;
  return obj;
}
async function salvarVarios(ops) {
  if (!ops.length) return;
  await api('POST', '/api/sync', { ops });
  for (const o of ops) { if (o.apagar) delete DB[o.c][o.id]; else DB[o.c][o.id] = o.dados; }
}
async function apagar(c, id) {
  await api('POST', '/api/sync', { ops: [{ c, id, apagar: 1 }] });
  delete DB[c][id];
}
setInterval(async () => {
  if (!EU || document.hidden || $('.fundo-modal')) return;
  try { if (await carregar()) render(); } catch {}
}, 20000);
window.addEventListener('focus', async () => { if (EU && !$('.fundo-modal')) { try { if (await carregar()) render(); } catch {} } });

// ---------------- configuração ----------------
const CHECKLIST_PADRAO = {
  computador: ['Limpeza interna (poeira, ventoinhas)', 'Troca de pasta térmica', 'Verificação de saúde do HD/SSD (SMART)', 'Atualizações do sistema operacional',
    'Antivírus ativo e atualizado', 'Verificação do backup', 'Limpeza de arquivos temporários', 'Teste de rede/internet', 'Verificação de temperatura', 'Conferência do inventário (hardware/softwares)'],
  impressora: ['Limpeza interna', 'Limpeza dos rolos de tração', 'Verificação do toner/tinta', 'Verificação do cilindro/unidade de imagem', 'Leitura do contador de páginas', 'Página de teste', 'Teste de digitalização'],
  rede: ['Verificação do roteador / Wi-Fi', 'Atualização de firmware', 'Teste de velocidade da internet', 'Verificação do switch e cabeamento', 'Revisão de senhas e acessos'],
  dvr: ['Imagem de todas as câmeras', 'Gravação funcionando (dias gravados)', 'Saúde do HD do DVR', 'Data e hora corretas', 'Acesso remoto / aplicativo funcionando', 'Limpeza das lentes'],
  nobreak: ['Teste de autonomia do nobreak', 'Estado da bateria'],
};
const PERIODO_PADRAO = { computador: 180, impressora: 90, rede: 180, dvr: 90, nobreak: 180, outro: 0 };
function cfg() {
  const c = DB.config.geral || {};
  return {
    empresa: c.empresa || 'RM Informática',
    diasAviso: Number(c.diasAviso) || 15,
    periodo: { ...PERIODO_PADRAO, ...(c.periodo || {}) },
    checklist: { ...CHECKLIST_PADRAO, ...(c.checklist || {}) },
    tecnicos: c.tecnicos || '',
  };
}

// ---------------- tipos de equipamento e campos ----------------
const TIPOS = {
  computador: { nome: 'Computador', grupo: 'computador' },
  notebook: { nome: 'Notebook', grupo: 'computador' },
  servidor: { nome: 'Servidor', grupo: 'computador' },
  impressora: { nome: 'Impressora', grupo: 'impressora' },
  rede: { nome: 'Roteador / Rede', grupo: 'rede' },
  dvr: { nome: 'DVR / NVR / Câmeras', grupo: 'dvr' },
  nobreak: { nome: 'Nobreak / Estabilizador', grupo: 'nobreak' },
  outro: { nome: 'Outro equipamento', grupo: 'outro' },
};
const grupoDe = (e) => (TIPOS[e.tipo] || TIPOS.outro).grupo;
const nomeTipo = (t) => (TIPOS[t] || TIPOS.outro).nome;

// f(chave, rótulo, tipo, opções)  — tipo: text, number, date, select, textarea, list, checks
const f = (k, l, t = 'text', o = {}) => ({ k, l, t, ...o });
const SIMNAO = ['', 'Sim', 'Não'];
const REDE_CAMPOS = (pref = '') => [
  f('conexao', 'Conexão', 'select', { op: ['', 'Cabo (rede)', 'Wi-Fi', 'Cabo + Wi-Fi', 'USB', 'Compartilhada por um PC'] }),
  f('ipTipo', 'Tipo de IP', 'select', { op: ['', 'Fixo (manual)', 'DHCP (automático)', 'Reserva no DHCP'] }),
  f('ip', 'Endereço IP', 'text', { ph: '192.168.0.10', cls: 'mono' }),
  f('mascara', 'Máscara', 'text', { ph: '255.255.255.0', cls: 'mono' }),
  f('gateway', 'Gateway', 'text', { ph: '192.168.0.1', cls: 'mono' }),
  f('dns', 'DNS', 'text', { ph: '8.8.8.8, 1.1.1.1', cls: 'mono' }),
  f('mac', 'MAC (cabo)', 'text', { ph: 'AA:BB:CC:DD:EE:FF', cls: 'mono' }),
  f('macWifi', 'MAC (Wi-Fi)', 'text', { cls: 'mono' }),
  f('pontoRede', 'Ponto de rede / porta do switch', 'text'),
];

const SEC_IDENT = { t: 'Identificação', campos: [
  f('tipo', 'Tipo de equipamento', 'select', { op: Object.entries(TIPOS).map(([k, v]) => [k, v.nome]), req: 1 }),
  f('clienteId', 'Cliente', 'cliente', { req: 1, cls: 'l2' }),
  f('codigo', 'Código interno', 'text', { ph: 'automático' }),
  f('nome', 'Nome / identificação', 'text', { ph: 'Ex.: PC Recepção 01', cls: 'l2' }),
  f('marca', 'Marca', 'text', { sug: 'marca' }),
  f('modelo', 'Modelo', 'text', { sug: 'modelo' }),
  f('numeroSerie', 'Número de série', 'text', { cls: 'mono' }),
  f('patrimonio', 'Patrimônio / etiqueta', 'text'),
  f('partNumber', 'Part number / código do produto', 'text'),
  f('status', 'Situação', 'select', { op: ['Ativo', 'Em manutenção', 'Reserva / estoque', 'Emprestado', 'Desativado'] }),
] };
const SEC_LOCAL = { t: 'Localização', campos: [
  f('unidade', 'Unidade / filial', 'text', { sug: 'unidade' }),
  f('setor', 'Setor / departamento', 'text', { sug: 'setor' }),
  f('local', 'Local / sala', 'text', { sug: 'local' }),
  f('andar', 'Andar', 'text'),
  f('responsavel', 'Usuário / responsável', 'text'),
  f('ramal', 'Ramal / telefone', 'text'),
  f('emailUsuario', 'E-mail do usuário', 'text'),
] };
const SEC_AQUIS = { t: 'Aquisição e garantia', campos: [
  f('propriedade', 'Propriedade', 'select', { op: ['', 'Do cliente', 'Locado (RM Informática)', 'Locado (terceiro)', 'Comodato'] }),
  f('dataAquisicao', 'Data de compra / instalação', 'date'),
  f('fornecedor', 'Fornecedor / loja', 'text'),
  f('notaFiscal', 'Nota fiscal', 'text'),
  f('valor', 'Valor (R$)', 'number', { step: '0.01' }),
  f('garantiaAte', 'Garantia até', 'date'),
  f('contrato', 'Contrato de locação / nº', 'text'),
  f('valorLocacao', 'Valor mensal da locação (R$)', 'number', { step: '0.01' }),
] };
const SEC_MANUT = { t: 'Manutenção preventiva', campos: [
  f('periodicidade', 'Fazer preventiva a cada (dias)', 'number', { ph: 'padrão' }),
  f('ultimaPreventivaAnterior', 'Última preventiva (antes do sistema)', 'date'),
  f('obs', 'Observações gerais', 'textarea', { cls: 'l4' }),
] };

const SECOES_TIPO = {
  computador: [
    { t: 'Hardware', campos: [
      f('formato', 'Formato', 'select', { op: ['', 'Desktop (gabinete)', 'Notebook', 'All-in-one', 'Mini PC', 'Servidor torre', 'Servidor rack', 'Workstation'] }),
      f('processador', 'Processador', 'text', { ph: 'Ex.: Intel Core i5-10400 2.9GHz', cls: 'l2' }),
      f('nucleos', 'Núcleos / threads', 'text', { ph: '6 / 12' }),
      f('placaMae', 'Placa-mãe', 'text', { cls: 'l2' }),
      f('bios', 'Versão da BIOS', 'text'),
      f('chipset', 'Chipset', 'text'),
      f('memoriaTotal', 'Memória RAM total (GB)', 'number'),
      f('memoriaTipo', 'Tipo de memória', 'select', { op: ['', 'DDR2', 'DDR3', 'DDR3L', 'DDR4', 'DDR5', 'LPDDR4', 'LPDDR5'] }),
      f('memoriaPentes', 'Pentes de memória', 'text', { ph: 'Ex.: 2x 8GB 3200MHz' }),
      f('memoriaSlots', 'Slots (usados / total)', 'text', { ph: '2 / 4' }),
      f('placaVideo', 'Placa de vídeo', 'text', { ph: 'Integrada / modelo', cls: 'l2' }),
      f('fonte', 'Fonte', 'text', { ph: 'Ex.: 500W 80 Plus' }),

// ---------------- formulários genéricos ----------------
function sugestoes(chave) {
  const s = new Set();
  for (const col of [DB.equipamentos, DB.clientes]) for (const o of Object.values(col)) if (o[chave]) s.add(String(o[chave]));
  return [...s].sort((a, b) => a.localeCompare(b, 'pt-BR'));
}
function opcoesClientes(sel) {
  const lista = Object.values(DB.clientes).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  return '<option value="">— escolha —</option>' + lista.map((c) => `<option value="${esc(c.id)}"${c.id === sel ? ' selected' : ''}>${esc(c.nome)}</option>`).join('');
}
function htmlInput(c, v, nome) {
  const n = esc(nome || c.k), val = v ?? '';
  const cls = (c.cls || '').includes('mono') ? ' class="mono"' : '';
  if (c.t === 'select') {
    return `<select name="${n}">${c.op.map((o) => { const [k, l] = Array.isArray(o) ? o : [o, o || '—']; return `<option value="${esc(k)}"${String(k) === String(val) ? ' selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
  }
  if (c.t === 'textarea') return `<textarea name="${n}" placeholder="${esc(c.ph || '')}">${esc(val)}</textarea>`;
  if (c.t === 'cliente') return `<select name="${n}"${c.req ? ' required' : ''}>${opcoesClientes(val)}</select>`;
  const tipo = c.t === 'number' ? 'number' : c.t === 'date' ? 'date' : 'text';
  const dl = c.sug ? ` list="dl-${esc(c.sug)}"` : '';
  return `<input type="${tipo}" name="${n}" value="${esc(val)}"${cls}${dl}${c.step ? ` step="${c.step}"` : ''}${c.req ? ' required' : ''} placeholder="${esc(c.ph || '')}" autocomplete="off">`;
}
function htmlLista(c, linhas) {
  const cols = `grid-template-columns:${c.sub.map(() => 'minmax(90px,1fr)').join(' ')} 34px`;
  const linha = (d = {}) => `<div class="rep-linha" style="${cols}">${c.sub.map((s) => `<div><label>${esc(s.l)}</label>${htmlInput(s, d[s.k], 'sub:' + s.k)}</div>`).join('')}<button type="button" class="btn peq perigo" data-rem title="Remover">×</button></div>`;
  return `<div class="lista-rep" data-lista="${esc(c.k)}" data-tpl="${esc(linha())}">${(linhas || []).map(linha).join('')}<button type="button" class="btn peq" data-add>+ adicionar</button></div>`;
}
function htmlSecoes(secoes, dados, extra = {}) {
  const dls = new Set();
  let h = '';
  for (const s of secoes) {
    h += `<div class="form-sec"><h3>${esc(s.t)}</h3><div class="campos">`;
    for (const c of s.campos) {
      if (c.sug) dls.add(c.sug);
      const cls = c.cls ? c.cls.replace('mono', '').trim() : '';
      if (c.t === 'aviso') { h += `<div class="campo l4 suave peq">${esc(c.l)}</div>`; continue; }
      if (c.t === 'list') { h += `<div class="campo ${cls || 'l4'}">${c.l ? `<label>${esc(c.l)}</label>` : ''}${htmlLista(c, dados[c.k])}</div>`; continue; }
      if (c.t === 'equip') {
        const eqs = Object.values(DB.equipamentos).filter((e) => e.clienteId === (extra.clienteId || dados.clienteId) && TIPOS[e.tipo]?.grupo === 'computador');
        h += `<div class="campo ${cls}"><label>${esc(c.l)}</label><select name="${c.k}"><option value="">—</option>${eqs.map((e) => `<option value="${esc(e.id)}"${e.id === dados[c.k] ? ' selected' : ''}>${esc(rotuloEquip(e))}</option>`).join('')}</select></div>`;
        continue;
      }
      h += `<div class="campo ${cls}"><label>${esc(c.l)}${c.req ? ' *' : ''}</label>${htmlInput(c, dados[c.k])}</div>`;
    }
    h += '</div></div>';
  }
  for (const d of dls) h += `<datalist id="dl-${esc(d)}">${sugestoes(d).map((v) => `<option value="${esc(v)}">`).join('')}</datalist>`;
  return h;
}
function ligarListas(el) {
  el.addEventListener('click', (ev) => {
    const add = ev.target.closest('[data-add]');
    if (add) { const box = add.closest('[data-lista]'); add.insertAdjacentHTML('beforebegin', box.dataset.tpl); return; }
    const rem = ev.target.closest('[data-rem]');
    if (rem) rem.closest('.rep-linha').remove();
  });
}
function lerSecoes(form, secoes) {
  const o = {};
  for (const s of secoes) for (const c of s.campos) {
    if (c.t === 'aviso') continue;
    if (c.t === 'list') {
      const box = form.querySelector(`[data-lista="${c.k}"]`);
      if (!box) continue;
      o[c.k] = $$('.rep-linha', box).map((ln) => {
        const d = {};
        for (const s2 of c.sub) { const inp = ln.querySelector(`[name="sub:${s2.k}"]`); if (inp && inp.value.trim()) d[s2.k] = inp.value.trim(); }
        return d;
      }).filter((d) => Object.keys(d).length);
      continue;
    }
    const inp = form.elements[c.k];
    if (!inp) continue;
    const v = inp.value.trim();
    o[c.k] = c.t === 'number' && v !== '' ? Number(v) : v;
  }
  return o;
}
function htmlVisao(secoes, d) {
  let h = '';
  for (const s of secoes) {
    let corpo = '';
    for (const c of s.campos) {
      if (['aviso'].includes(c.t) || c.k === 'tipo' || c.k === 'clienteId') continue;
      const v = d[c.k];
      if (c.t === 'list') {
        if (!v || !v.length) continue;
        corpo += `<div class="l4"><div class="tabela-wrap"><table class="sub-tabela"><thead><tr>${c.sub.map((x) => `<th>${esc(x.l)}</th>`).join('')}</tr></thead><tbody>${v.map((ln) => `<tr>${c.sub.map((x) => `<td>${esc(ln[x.k] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
        continue;
      }
      if (v === '' || v == null) continue;
      let txt = esc(v);
      if (c.t === 'date') txt = dataBR(v);
      else if (c.t === 'select' && Array.isArray(c.op[0])) txt = esc((c.op.find((o) => o[0] === v) || [, v])[1]);
      else if (c.t === 'equip') { const e = DB.equipamentos[v]; txt = e ? `<a href="#/equipamento/${esc(e.id)}">${esc(rotuloEquip(e))}</a>` : ''; }
      else if (c.k.startsWith('valor') && c.t === 'number') txt = moeda(v);
      else if (c.t === 'textarea') txt = esc(v).replace(/\n/g, '<br>');
      else if (c.k === 'painelWeb' && /^https?:\/\//i.test(v)) txt = `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`;
      if ((c.cls || '').includes('mono')) txt = `<span class="mono">${txt}</span>`;
      const cls = c.t === 'textarea' ? 'l4' : (c.cls || '').includes('l2') ? 'l2' : '';
      corpo += `<div class="${cls}"><dt>${esc(c.l)}</dt><dd>${txt}</dd></div>`;
    }
    if (corpo) h += `<div class="card"><h3>${esc(s.t)}</h3><dl class="dl">${corpo}</dl></div>`;
  }
  return h;
}

function modal({ titulo, corpo, salvar: aoSalvar, estreito, textoSalvar = 'Salvar', extraRodape = '' }) {
  const fundo = document.createElement('div');
  fundo.className = 'fundo-modal';
  fundo.innerHTML = `<form class="modal${estreito ? ' estreito' : ''}" novalidate>
    <div class="modal-topo"><h2 style="margin:0">${esc(titulo)}</h2><button type="button" class="fechar" data-fechar aria-label="Fechar">×</button></div>
    <div class="modal-corpo">${corpo}</div>
    <div class="modal-rodape">${extraRodape}<span style="flex:1"></span><button type="button" class="btn" data-fechar>Cancelar</button>${aoSalvar ? `<button class="btn pri">${esc(textoSalvar)}</button>` : ''}</div></form>`;
  document.body.appendChild(fundo);
  const form = $('form', fundo);
  const fechar = () => { fundo.remove(); document.removeEventListener('keydown', tecla); };
  const tecla = (e) => { if (e.key === 'Escape') fechar(); };
  document.addEventListener('keydown', tecla);
  $$('[data-fechar]', fundo).forEach((b) => (b.onclick = fechar));
  ligarListas(form);
  form.onsubmit = async (ev) => {
    ev.preventDefault();
    const falta = $$('[required]', form).find((i) => !i.value.trim());
    if (falta) { falta.focus(); toast('Preencha os campos obrigatórios (*)', 1); return; }
    const btn = $('.btn.pri', form); btn.disabled = true;
    try { if ((await aoSalvar(form)) !== false) fechar(); }
    catch (e) { toast(e.message, 1); }
    finally { btn.disabled = false; }
  };
  setTimeout(() => { const i = $('input:not([type=hidden]),select,textarea', form); if (i && window.innerWidth > 760) i.focus(); }, 30);
  return { form, fechar, fundo };
}
function confirmar(msg) { return window.confirm(msg); }

// ---------------- regras de manutenção e visitas ----------------
const rotuloEquip = (e) => [e.nome || nomeTipo(e.tipo), [e.marca, e.modelo].filter(Boolean).join(' ')].filter(Boolean).join(' — ') + (e.codigo ? ` (${e.codigo})` : '');
const nomeCliente = (id) => (DB.clientes[id] ? DB.clientes[id].nome : '(cliente removido)');
const equipAtivo = (e) => !['Desativado'].includes(e.status);
const atendimentosDe = (filtro) => Object.values(DB.manutencoes).filter(filtro).sort((a, b) => (b.data || '').localeCompare(a.data || '') || (b.horaInicio || '').localeCompare(a.horaInicio || ''));

function periodoEquip(e) {
  if (Number(e.periodicidade) > 0) return Number(e.periodicidade);
  const c = DB.clientes[e.clienteId];
  if (c && Number(c.preventivaPadrao) > 0) return Number(c.preventivaPadrao);
  return Number(cfg().periodo[grupoDe(e)]) || 0;
}
function ultimaPreventiva(e) {
  let ult = e.ultimaPreventivaAnterior || '';
  for (const m of Object.values(DB.manutencoes)) {
    if (m.status === 'Agendado') continue;
    if ((m.tipo === 'Manutenção preventiva' || (m.preventivaEquip || []).includes(e.id)) && (m.equipamentos || []).includes(e.id) && (m.data || '') > ult) ult = m.data;
  }
  return ult;
}
// situação: {data, dias (positivo = faltam, negativo = atrasado), estado: ok|aviso|atraso|sem}
function situacao(data) {
  if (!data) return { estado: 'sem' };
  const dias = difDias(data, hoje());
  return { data, dias, estado: dias < 0 ? 'atraso' : dias <= cfg().diasAviso ? 'aviso' : 'ok' };
}
function proximaPreventiva(e) {
  const per = periodoEquip(e);
  if (!per || !equipAtivo(e)) return { estado: 'sem', ultima: ultimaPreventiva(e) };
  const ult = ultimaPreventiva(e);
  const base = ult || e.dataAquisicao || (e.criadoEm || '').slice(0, 10) || hoje();
  return { ...situacao(somaDias(base, per)), ultima: ult, periodo: per };
}
function proximaVisita(c) {
  const ats = atendimentosDe((m) => m.clienteId === c.id && m.status !== 'Agendado');
  const ultVisita = ats.find((m) => CONTA_VISITA.includes(m.tipo));
  const agendado = atendimentosDe((m) => m.clienteId === c.id && m.status === 'Agendado' && (m.data || '') >= hoje()).pop();
  // a próxima visita marcada no último atendimento tem prioridade
  const marcada = ats.find((m) => m.proximaVisita);
  let data = '';
  if (agendado) data = agendado.data;
  else if (marcada && (!ultVisita || (marcada.data || '') >= (ultVisita.data || ''))) data = marcada.proximaVisita;
  else if (Number(c.periodicidadeVisita) > 0) {
    const base = (ultVisita && ultVisita.data) || c.inicioContrato || (c.criadoEm || '').slice(0, 10) || hoje();
    data = somaDias(base, c.periodicidadeVisita);
  }
  if (c.situacao === 'Inativo') data = '';
  return { ...situacao(data), ultima: ultVisita ? ultVisita.data : '', agendado: !!agendado };
}
function tagSituacao(s, semTexto = '—') {
  if (!s || s.estado === 'sem') return `<span class="suave">${semTexto}</span>`;
  const txt = s.dias < 0 ? `atrasada ${-s.dias} dia${s.dias === -1 ? '' : 's'}` : s.dias === 0 ? 'hoje' : `em ${s.dias} dia${s.dias === 1 ? '' : 's'}`;
  return `<span class="tag ${s.estado}" title="${dataBR(s.data)}">${dataBR(s.data)} · ${txt}</span>`;
}
function pendencias() {
  const visitas = Object.values(DB.clientes).map((c) => ({ c, s: proximaVisita(c) })).filter((x) => x.s.estado === 'atraso' || x.s.estado === 'aviso');
  const prev = Object.values(DB.equipamentos).filter(equipAtivo).map((e) => ({ e, s: proximaPreventiva(e) })).filter((x) => x.s.estado === 'atraso' || x.s.estado === 'aviso');
  return { visitas, prev, atrasos: visitas.filter((x) => x.s.estado === 'atraso').length + prev.filter((x) => x.s.estado === 'atraso').length };
}
function proximoCodigo() {
  let max = 0;
  for (const e of Object.values(DB.equipamentos)) { const m = /^EQ-?(\d+)$/i.exec(e.codigo || ''); if (m) max = Math.max(max, Number(m[1])); }
  return 'EQ-' + String(max + 1).padStart(4, '0');
}

function gerarSenha(n = 14) {
  const cs = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789@#$%&*!?';

function avisarNavegador(forcar) {

function filtrarEquip() {
  const F = FILTRO.equip, q = norm(F.q);
  return Object.values(DB.equipamentos).filter((e) => {
    if (F.cliente && e.clienteId !== F.cliente) return false;
    if (F.tipo && e.tipo !== F.tipo) return false;
    if (F.setor && e.setor !== F.setor) return false;
    if (F.status ? (e.status || 'Ativo') !== F.status : e.status === 'Desativado') return false;
    if (F.prev) { const s = proximaPreventiva(e).estado; if (F.prev === 'vencer' ? !(s === 'atraso' || s === 'aviso') : s !== F.prev) return false; }
    if (q) {
      const txt = norm(Object.values(e).map((v) => (typeof v === 'object' ? JSON.stringify(v) : v)).join(' ') + ' ' + nomeCliente(e.clienteId));
      if (!q.split(/\s+/).every((p) => txt.includes(p))) return false;
    }
    return true;
  }).sort((a, b) => nomeCliente(a.clienteId).localeCompare(nomeCliente(b.clienteId), 'pt-BR') || (a.tipo || '').localeCompare(b.tipo || '') || rotuloEquip(a).localeCompare(rotuloEquip(b), 'pt-BR'));
}

function exportarCsv(lista) {
  const cols = [['cliente', 'Cliente'], ['tipoNome', 'Tipo']];
  const vistos = new Set(['cliente', 'tipoNome']);
  for (const t of Object.keys(TIPOS)) for (const s of secoesEquip(t)) for (const c of s.campos) if (!['aviso', 'cliente'].includes(c.t) && c.k !== 'tipo' && !vistos.has(c.k)) { vistos.add(c.k); cols.push([c.k, c.l || s.t]); }
  cols.push(['ultimaPrev', 'Última preventiva'], ['proxPrev', 'Próxima preventiva']);
  const valor = (e, k) => {
    if (k === 'cliente') return nomeCliente(e.clienteId);
    if (k === 'tipoNome') return nomeTipo(e.tipo);
    if (k === 'ultimaPrev') return dataBR(ultimaPreventiva(e));
    if (k === 'proxPrev') return dataBR(proximaPreventiva(e).data);
    if (k === 'computadorHost') return e[k] && DB.equipamentos[e[k]] ? rotuloEquip(DB.equipamentos[e[k]]) : '';
    const v = e[k];
    if (Array.isArray(v)) return v.map((x) => Object.values(x).join(' ')).join(' | ');
    if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return dataBR(v);
    return v ?? '';
  };
  const usadas = cols.filter(([k]) => ['cliente', 'tipoNome', 'proxPrev'].includes(k) || lista.some((e) => valor(e, k) !== ''));
  const linhas = [usadas.map((c) => c[1]), ...lista.map((e) => usadas.map(([k]) => valor(e, k)))];

      ${m.pendencias ? `<div class="l4"><dt>Pendências</dt><dd>${esc(m.pendencias).replace(/\n/g, '<br>')}</dd></div>` : ''}
    </dl>
    ${eqs.length ? `<h3 style="margin-top:16px">Equipamentos (${eqs.length})</h3><table class="sub-tabela"><tbody>${eqs.map((e) => `<tr><td><a href="#/equipamento/${esc(e.id)}">${esc(rotuloEquip(e))}</a></td><td class="suave">${esc([e.setor, e.local].filter(Boolean).join(' · '))}</td><td>${m.contadores?.[e.id] != null ? 'contador: ' + Number(m.contadores[e.id]).toLocaleString('pt-BR') : ''}${(m.preventivaEquip || []).includes(e.id) ? ' <span class="tag ok">preventiva</span>' : ''}</td></tr>`).join('')}</tbody></table>` : ''}
    ${(m.checklist || []).length ? `<h3 style="margin-top:16px">Checklist</h3><div class="checks">${m.checklist.map((t) => `<div>✓ ${esc(t)}</div>`).join('')}</div>` : ''}
    ${(m.pecas || []).length ? `<h3 style="margin-top:16px">Peças e serviços</h3><table class="sub-tabela"><thead><tr><th>Peça / serviço</th><th>Qtd</th><th>Valor</th><th>Equipamento</th></tr></thead><tbody>${m.pecas.map((p) => `<tr><td>${esc(p.peca)}</td><td>${esc(p.qtd || '')}</td><td>${moeda(p.valor)}</td><td>${esc(DB.equipamentos[p.equipamento]?.nome || '')}</td></tr>`).join('')}${totalPecas ? `<tr><td colspan="2"><b>Total</b></td><td><b>${moeda(totalPecas)}</b></td><td></td></tr>` : ''}</tbody></table>` : ''}
    <p class="suave peq" style="margin-top:14px">Registrado por ${esc(m.criadoPor || '?')} em ${new Date(m.criadoEm || Date.now()).toLocaleString('pt-BR')}</p>`,
    extraRodape: '<button type="button" class="btn" id="b-imp-at">Imprimir</button><button type="button" class="btn pri" id="b-edit-at">Editar</button>',
  });
  $('#b-edit-at').onclick = () => { v.fechar(); formAtendimento(m); };
  $('#b-imp-at').onclick = () => {
    const w = window.open('', '_blank');
    if (!w) return toast('Permita pop-ups para imprimir', 1);
    w.document.write(`<!doctype html><meta charset="utf-8"><title>Atendimento ${dataBR(m.data)}</title><style>body{font:13px system-ui,Arial;margin:24px;color:#111}h1{font-size:18px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:5px;text-align:left}.dl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.dl .l4{grid-column:1/-1}.dl .l2{grid-column:span 2}dt{font-size:11px;color:#666;text-transform:uppercase}dd{margin:0}.tag{font-weight:600}a{color:#111;text-decoration:none}h3{font-size:12px;text-transform:uppercase;color:#555}.checks{columns:2}.assin{margin-top:60px;display:flex;gap:40px}.assin div{flex:1;border-top:1px solid #000;text-align:center;padding-top:4px}</style>
      <h1>${esc(cfg().empresa)} — Relatório de atendimento</h1>${$('.modal-corpo', v.fundo).innerHTML}<div class="assin"><div>${esc(m.tecnico || 'Técnico')}</div><div>Cliente${m.responsavelCliente ? ': ' + esc(m.responsavelCliente) : ''}</div></div><script>print()<\/script>`);
    w.document.close();
  };
}

// ----- Senhas -----
async function telaSenhas() {
  if (!podeSenhas()) { location.hash = '#/painel'; return; }
  const F = FILTRO.senha;
  const aba = telaSenhas.aba || 'lista';
  casca(topo('Senhas', '<button class="btn pri" id="b-nova">+ Nova senha</button>', 'Roteadores, Wi-Fi, DVRs, sistemas e acessos dos clientes') + `
  ${ehAdmin() ? `<div class="abas"><button data-aba="lista" class="${aba === 'lista' ? 'ativo' : ''}">Senhas</button><button data-aba="log" class="${aba === 'log' ? 'ativo' : ''}">Quem viu / alterou</button></div>` : ''}
  <div id="area-senhas"><div class="card vazio">Carregando...</div></div>`);
  $('#b-nova').onclick = () => formCred(null, { cliente_id: F.cliente }, () => telaSenhas());
  $$('[data-aba]').forEach((b) => (b.onclick = () => { telaSenhas.aba = b.dataset.aba; telaSenhas(); }));
  const area = $('#area-senhas');
  try {
    if (aba === 'log' && ehAdmin()) {
      const log = await api('GET', '/api/credenciais/log');
      area.innerHTML = `<div class="card" style="padding:0">${log.length ? `<div class="tabela-wrap"><table><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Senha</th><th class="esconde-cel">IP</th></tr></thead><tbody>${log.map((l) => `<tr><td style="white-space:nowrap">${esc(new Date(l.quando.replace(' ', 'T')).toLocaleString('pt-BR'))}</td><td>${esc(l.usuario_nome)}</td><td>${esc(l.acao)}</td><td>${esc(l.titulo)}</td><td class="esconde-cel mono peq">${esc(l.ip || '')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="vazio">Nenhum registro ainda.</div>'}</div>`;
      return;
    }
    const todas = await carregarCreds(true);
    const desenhar = () => {
      const q = norm(F.q);
      const l = todas.filter((c) => (!F.cliente || c.cliente_id === F.cliente) && (!F.tipo || c.tipo === F.tipo)
        && (!q || norm([c.titulo, c.usuario, c.ssid, c.endereco, c.obs, nomeCliente(c.cliente_id), c.equipamento_id && DB.equipamentos[c.equipamento_id] ? rotuloEquip(DB.equipamentos[c.equipamento_id]) : ''].join(' ')).includes(q)))
        .sort((a, b) => nomeCliente(a.cliente_id).localeCompare(nomeCliente(b.cliente_id), 'pt-BR') || a.titulo.localeCompare(b.titulo, 'pt-BR'));
      $('#lista-creds').innerHTML = tabelaCreds(l);
    };
    area.innerHTML = `<div class="filtros"><input type="search" id="q" placeholder="Buscar por descrição, SSID, usuário, IP..." value="${esc(F.q)}">
      <select id="f-cliente"><option value="">Todos os clientes</option>${Object.values(DB.clientes).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map((c) => `<option value="${esc(c.id)}"${c.id === F.cliente ? ' selected' : ''}>${esc(c.nome)}</option>`).join('')}</select>
      <select id="f-tipo"><option value="">Todos os tipos</option>${Object.entries(TIPOS_CRED_CURTO).map(([k, v]) => `<option value="${k}"${k === F.tipo ? ' selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="card" style="padding:0" id="lista-creds"></div>
      <p class="suave peq">As senhas ficam criptografadas no servidor e só aparecem quando você clica em "mostrar" ou "copiar". Cada visualização fica registrada.</p>`;
    desenhar();
    ligarCreds($('#lista-creds'), () => telaSenhas());
    $('#q').oninput = (e) => { F.q = e.target.value; desenhar(); };
    $('#f-cliente').onchange = (e) => { F.cliente = e.target.value; desenhar(); };
    $('#f-tipo').onchange = (e) => { F.tipo = e.target.value; desenhar(); };
  } catch (e) { area.innerHTML = `<div class="card vazio">${esc(e.message)}</div>`; }
}

// ----- Usuários -----
async function telaUsuarios() {
  if (!ehAdmin()) { location.hash = '#/painel'; return; }
  casca(topo('Usuários do sistema', '<button class="btn pri" id="b-novo">+ Novo usuário</button>', 'Quem pode entrar no sistema') + '<div class="card" style="padding:0" id="lista-u"><div class="vazio">Carregando...</div></div>' +
    '<div class="info-caixa"><b>Administrador</b>: acesso a tudo, inclusive usuários e configurações. <b>Técnico</b>: cadastra clientes, equipamentos e atendimentos. A permissão <b>"Pode ver senhas"</b> libera o cofre de senhas para o técnico.</div>');
  const us = await api('GET', '/api/usuarios');
  $('#lista-u').innerHTML = `<div class="tabela-wrap"><table><thead><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Senhas</th><th>Situação</th><th></th></tr></thead><tbody>
    ${us.map((u) => `<tr><td>${esc(u.nome)}</td><td class="mono">${esc(u.login)}</td><td>${u.perfil === 'admin' ? 'Administrador' : 'Técnico'}</td><td>${u.perfil === 'admin' || u.pode_senhas ? '<span class="tag ok">pode ver</span>' : '<span class="tag">não</span>'}</td><td>${u.ativo ? '<span class="tag ok">ativo</span>' : '<span class="tag">bloqueado</span>'}</td><td><button class="btn peq" data-u="${u.id}">Editar</button></td></tr>`).join('')}</tbody></table></div>`;
  $('#b-novo').onclick = () => formUsuario();
  $$('[data-u]').forEach((b) => (b.onclick = () => formUsuario(us.find((u) => String(u.id) === b.dataset.u))));
}
function formUsuario(u) {
  const novo = !u;
  modal({
    titulo: novo ? 'Novo usuário' : 'Editar usuário', estreito: true,
    corpo: `<div class="campos" style="grid-template-columns:1fr 1fr">
      <div class="campo l4"><label>Nome *</label><input name="nome" value="${esc(u?.nome || '')}" required></div>
      <div class="campo l2"><label>Usuário (login) *</label><input name="login" value="${esc(u?.login || '')}" ${novo ? 'required' : 'disabled'} autocomplete="off"></div>
      <div class="campo l2"><label>Perfil</label><select name="perfil"><option value="tecnico">Técnico</option><option value="admin"${u?.perfil === 'admin' ? ' selected' : ''}>Administrador</option></select></div>
      <div class="campo l4"><label>${novo ? 'Senha * (mínimo 6 caracteres)' : 'Nova senha (deixe em branco para não trocar)'}</label><input name="senha" type="password" autocomplete="new-password" ${novo ? 'required' : ''}></div>
      <div class="campo l4"><label style="display:flex;gap:8px;font-weight:400;color:inherit"><input type="checkbox" name="pode_senhas" style="width:auto"${u?.pode_senhas ? ' checked' : ''}> Pode ver o cofre de senhas dos clientes</label></div>
      ${novo ? '' : `<div class="campo l4"><label style="display:flex;gap:8px;font-weight:400;color:inherit"><input type="checkbox" name="ativo" style="width:auto"${u.ativo ? ' checked' : ''}> Acesso liberado (desmarque para bloquear)</label></div>`}
    </div>`,
    salvar: async (form) => {
      const el = form.elements;
      const d = { nome: el.nome.value, perfil: el.perfil.value, pode_senhas: el.pode_senhas.checked };
      if (el.senha.value) d.senha = el.senha.value;
      if (novo) { d.login = el.login.value; await api('POST', '/api/usuarios', d); }
      else { d.ativo = el.ativo.checked; await api('PUT', '/api/usuarios/' + u.id, d); }
      toast('Usuário salvo'); telaUsuarios();
    },
  });
}
function telaConta() {
  casca(topo('Minha senha') + `<div class="card" style="max-width:420px"><form id="f-senha">
    <div class="campo" style="margin-bottom:10px"><label>Senha atual</label><input type="password" name="atual" required autocomplete="current-password"></div>
    <div class="campo" style="margin-bottom:10px"><label>Nova senha (mínimo 6 caracteres)</label><input type="password" name="nova" required autocomplete="new-password"></div>
    <div class="campo" style="margin-bottom:14px"><label>Repita a nova senha</label><input type="password" name="nova2" required autocomplete="new-password"></div>
    <button class="btn pri">Trocar senha</button></form></div>`);
  $('#f-senha').onsubmit = async (ev) => {
    ev.preventDefault();
    const el = ev.target.elements;
    if (el.nova.value !== el.nova2.value) return toast('As senhas novas não são iguais', 1);
    try { await api('POST', '/api/me/senha', { atual: el.atual.value, nova: el.nova.value }); toast('Senha trocada'); ev.target.reset(); } catch (e) { toast(e.message, 1); }
  };
}

// ----- Configurações -----
function telaConfig() {
  if (!ehAdmin()) { location.hash = '#/painel'; return; }
  const C = cfg();
  const g = { computador: 'Computadores / notebooks / servidores', impressora: 'Impressoras', rede: 'Roteadores / rede', dvr: 'DVR / câmeras', nobreak: 'Nobreaks' };
  casca(topo('Configurações') + `<form id="f-cfg">
  <div class="card"><h2>Geral</h2><div class="campos">
    <div class="campo l2"><label>Nome da empresa</label><input name="empresa" value="${esc(C.empresa)}"></div>
    <div class="campo"><label>Avisar com quantos dias de antecedência</label><input type="number" name="diasAviso" value="${C.diasAviso}"></div>
    <div class="campo l4"><label>Técnicos (separados por vírgula — aparecem como sugestão nos atendimentos)</label><input name="tecnicos" value="${esc(C.tecnicos)}"></div>
  </div></div>
  <div class="card"><h2>Preventiva padrão por tipo de equipamento</h2><p class="suave peq" style="margin-top:-6px">Usado quando o equipamento e o cliente não têm periodicidade própria. Deixe 0 para não controlar.</p><div class="campos">
    ${Object.entries(g).map(([k, l]) => `<div class="campo"><label>${l} (dias)</label><input type="number" name="per-${k}" value="${C.periodo[k] ?? 0}"></div>`).join('')}
  </div></div>
  <div class="card"><h2>Checklists das manutenções</h2><p class="suave peq" style="margin-top:-6px">Um item por linha.</p><div class="campos">
    ${Object.entries(g).map(([k, l]) => `<div class="campo l2"><label>${l}</label><textarea name="chk-${k}" style="min-height:150px">${esc((C.checklist[k] || []).join('\n'))}</textarea></div>`).join('')}
  </div></div>
  <div class="acoes" style="margin-bottom:20px"><button class="btn pri">Salvar configurações</button></div>
  </form>
  <div class="card"><h2>Cópia dos dados</h2><p class="suave">O servidor faz um backup automático por dia. Aqui você também pode baixar todos os cadastros (clientes, equipamentos e atendimentos) num arquivo. As senhas do cofre não entram neste arquivo.</p>
    <button class="btn" id="b-exp">Baixar cópia (JSON)</button> <button class="btn" id="b-csv-all">Baixar inventário completo (planilha)</button></div>`);
  $('#f-cfg').onsubmit = async (ev) => {
    ev.preventDefault();
    const el = ev.target.elements;
    const d = { ...(DB.config.geral || {}), id: 'geral', empresa: el.empresa.value.trim(), diasAviso: Number(el.diasAviso.value) || 15, tecnicos: el.tecnicos.value, periodo: {}, checklist: {} };
    for (const k of Object.keys(g)) { d.periodo[k] = Number(el['per-' + k].value) || 0; d.checklist[k] = el['chk-' + k].value.split('\n').map((s) => s.trim()).filter(Boolean); }
    try { await salvar('config', d); toast('Configurações salvas'); render(); } catch (e) { toast(e.message, 1); }
  };
  $('#b-exp').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ exportadoEm: new Date().toISOString(), clientes: DB.clientes, equipamentos: DB.equipamentos, manutencoes: DB.manutencoes, config: DB.config }, null, 1)], { type: 'application/json' }));
    a.download = `rminfo-dados-${hoje()}.json`; a.click();
  };
  $('#b-csv-all').onclick = () => exportarCsv(Object.values(DB.equipamentos).sort((a, b) => nomeCliente(a.clienteId).localeCompare(nomeCliente(b.clienteId), 'pt-BR')));
}

// ---------------- início ----------------
async function iniciar() {
  $('#raiz').innerHTML = '<div class="vazio" style="padding:80px">Carregando...</div>';
  VERSAO = 0; for (const k of Object.keys(DB)) DB[k] = {};
  CREDS = null;
  await carregar();
  if (!location.hash) location.hash = '#/painel';
  render();
  avisarNavegador();
}
(async () => {
  try { EU = await api('GET', '/api/me'); await iniciar(); }
  catch { if (!EU) telaLogin(); }
})();
</script>
